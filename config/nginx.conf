# Serves the Customer Application at / (ADR-F01). index.html and every deep link are never cached (a release is
# picked up on the next load); hashed assets are immutable. /v1 is the public edge's route to finapp and is never
# answered here: a request that reaches nginx for it is a routing fault and gets 404, never the SPA.
# Security headers are set by the public edge's customer-web-headers middleware (ADR-F07). nginx adds only
# `nosniff`, so a pod reached past the edge still never has its files sniffed into another type. An add_header in a
# location replaces the server's, so each location repeats it. Adapted from finapp-admin-panel/deploy/nginx.conf.
server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;

    # Compressed on the way out (Stage 7, P18-TSK-039): uncompressed, the first load is about 620 KiB - about 3 s at a
    # mid-range phone's 1.6 Mbit/s before anything runs, over the 2.5 s LCP budget; compressed it is about 240 KiB
    # (LCP 2.2 s measured). Only public static
    # files pass here - no secret is ever in a compressed response, so BREACH does not apply.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /v1/ {
        return 404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }
}
