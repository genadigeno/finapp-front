# Serves the Customer Application at / (ADR-F01). index.html and every deep link are never cached (a release is
# picked up on the next load); hashed assets are immutable. /v1 is the public edge's route to finapp and is never
# answered here: a request that reaches nginx for it is a routing fault and gets 404, never the SPA.
# Security headers are set by the public edge's customer-web-headers middleware (ADR-F07). nginx adds only
# `nosniff`, so a pod reached past the edge still never has its files sniffed into another type. An add_header in a
# location replaces the server's, so each location repeats it. Adapted from finapp-admin-panel/deploy/nginx.conf.
server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;
    root /usr/share/nginx/html;

    location /v1/ {
        return 404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }
}
